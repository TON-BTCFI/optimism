name: Build and Deploy Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Install Just
        run: |
          mkdir -p ~/bin
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ~/bin
          export PATH="$PATH:$HOME/bin"
          just --help

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build op-node binary
        run: |
          cd op-node
          export PATH="$PATH:$HOME/bin"
          just op-node

      - name: Save op-node binary as artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v3
        with:
          name: op-node-binary
          path: op-node/bin/op-node

      - name: Build op-deployer binary
        run: |
          cd op-deployer
          export PATH="$PATH:$HOME/bin"
          just

      - name: Save op-deployer binary as artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v3
        with:
          name: op-deployer-binary
          path: op-deployer/bin/op-deployer

  deploy:
    name: Push Docker Images
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Install Just (for act fallback)
        run: |
          mkdir -p ~/bin
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ~/bin
          export PATH="$PATH:$HOME/bin"
          just --help

      - name: Download op-node binary artifact
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v3
        with:
          name: op-node-binary
          path: ./op-node/bin

      - name: Build op-node binary (fallback for act)
        if: ${{ env.ACT }}
        run: |
          cd op-node
          export PATH="$PATH:$HOME/bin"
          just op-node

      - name: Download op-deployer binary artifact
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v3
        with:
          name: op-deployer-binary
          path: ./op-deployer/bin

      - name: Build op-deployer binary (fallback for act)
        if: ${{ env.ACT }}
        run: |
          cd op-deployer
          export PATH="$PATH:$HOME/bin"
          just

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push op-node Docker Image
        run: |
          docker build -t parthg1901/op-node:latest -f op-node/Dockerfile .
          docker tag op-node:latest parthg1901/op-node:latest
          docker push parthg1901/op-node:latest

      - name: Push op-deployer Docker Image
        run: |
          docker build -t parthg1901/op-deployer:latest . -f op-deployer/Dockerfile.default
          docker tag op-deployer:latest parthg1901/op-deployer:latest
          docker push parthg1901/op-deployer:latest
